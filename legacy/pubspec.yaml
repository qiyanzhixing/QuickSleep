name: quicksleep
description: Quiet, offline breathing guidance for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  just_audio: ^0.10.6
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  shared_preferences: ^2.5.3
  rxdart: ^0.28.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  audio_service_platform_interface: 0.1.3
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/catalog.json
    - assets/audio/zh/
    - assets/audio/en/
    - assets/audio/beds/
    - assets/visual/
    - assets/licenses/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
          weight: 400
