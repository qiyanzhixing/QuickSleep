name: Native clients
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare_assets.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_native.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p apps/android testDebugUnitTest lintDebug assembleDebug --console=plain
      - run: python scripts/check_native.py --apk apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quicksleep-native-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-and-lint-reports
          path: apps/android/app/build/reports/
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare_assets.py
      - run: python scripts/generate_ios_project.py && git diff --exit-code -- apps/ios/QuickSleep.xcodeproj
      - run: swift test --package-path apps/ios
      - run: xcodebuild -project apps/ios/QuickSleep.xcodeproj -scheme QuickSleep -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/ios/build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: quicksleep-native-ios-simulator
          path: apps/ios/build/Build/Products/Debug-iphonesimulator/QuickSleep.app
